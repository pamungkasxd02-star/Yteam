name: Yteam CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Yteam
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only YAML dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Bootstrap full sources for integration tests
        run: python scripts/bootstrap_sources.py --profile full
      - name: Compile integration sources
        run: python -m compileall -q scripts src
      - name: Run integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  upstream:
    name: Upstream source smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Yteam
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Bootstrap full upstream sources
        run: python scripts/bootstrap_sources.py --profile full
      - name: Test Cybermes
        working-directory: vendor/cybermes
        run: go test ./...
      - name: Install OpenCode dependencies
        working-directory: vendor/opencode
        run: bun install --frozen-lockfile
      - name: Typecheck OpenCode package
        working-directory: vendor/opencode/packages/opencode
        run: bun run typecheck
