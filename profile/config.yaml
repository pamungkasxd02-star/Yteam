# YTEAM profile defaults. API keys and tokens belong in a local ignored config.
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  nudge_interval: 10
agent:
  image_input_mode: auto
skills:
  external_dirs:
    - "${YTEAM_PROJECT_ROOT}/skills"
  project_discovery: true
  template_vars: true
  inline_shell: false
auxiliary:
  vision:
    provider: auto
    model: ""
  background_review:
    enabled: true
curator:
  enabled: true
  consolidate: true
  prune_builtins: false
runtime:
  mode: standalone
  direct_model_requests: true
  read_only: true
  no_auto_submit: true
